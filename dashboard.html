<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - SGG</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
<header class="theme-bar">
  <div class="theme-bar__logo">◈ SGG</div>
  <div class="theme-bar__toggle-wrap">
    <button class="theme-switch" id="themeToggle" aria-label="Cambiar tema">
      <span class="theme-switch__icon">☀</span>
      <div class="theme-switch__thumb"></div>
      <span class="theme-switch__icon">☾</span>
    </button>
  </div>
</header>

<main class="scene">
  <div class="card">
    <h2 class="panel__title">Gestión de Gastos</h2>

    <!-- Navegador interno -->
    <nav class="nav-dashboard">
      <button data-target="panelForm" class="btn-cta">Ingresar gasto</button>
      <button data-target="panelHistorial" class="btn-cta">Ver gastos</button>
      <button data-target="panelTotal" class="btn-cta">Consultar gastos</button>
      <button data-target="reportes">Reportes</button>
    </nav>

    <!-- Panel Total -->
     <section id="panelTotal" class="panel--off"> 
      <div id="panelTotalBox" class="welcome-box">
        <h2>Total Gastado</h2>
        <p id="totalGastado">$0</p>
      </div>
    </section>

    <section id="reportes" class="panel--off">

    <h2>Reportes</h2>

    <div style="max-width:600px;margin:auto;">
        <canvas id="graficoCategorias"></canvas>
    </div>

    <br>

    <div style="max-width:600px;margin:auto;">
        <canvas id="graficoBalance"></canvas>
    </div>

</section>

    <!-- Formulario Nuevo Gasto -->
    <section id="panelForm"> 
      <form id="formGasto">
        <div class="field">
          <label for="gastoMonto" class="field__label">Monto</label>
          <input type="number" id="gastoMonto" class="field__input" required>
           <div id="errMonto" class="field__err"></div>
        </div>
        <div class="field">
          <label for="gastoFecha" class="field__label">Fecha</label>
          <input type="date" id="gastoFecha" class="field__input" required>
        </div>
        <div class="field">
          <label for="gastoCategoria" class="field__label">Categoría</label>
          <select id="gastoCategoria" class="field__input" required>
            <option value="">Seleccione...</option>
            <option>Alimentación</option>
            <option>Transporte</option>
            <option>Servicios</option>
            <option>Otros</option>
          </select>
        </div>
        <div class="field">
    <label for="tipoMovimiento" class="field__label">
        Tipo de Movimiento
    </label>

    <select id="tipoMovimiento"
            class="field__input"
            required>
        <option value="">Seleccione...</option>
        <option value="ingreso">Ingreso</option>
        <option value="egreso">Egreso</option>
    </select>
    </div>
        <div class="field">
          <label for="gastoDescripcion" class="field__label">Descripción</label>
          <input type="text" id="gastoDescripcion" class="field__input" required>
        </div>
        <div class="field">
    <label for="comprobante" class="field__label">
        Comprobante (opcional)
    </label>

    <input
        type="file"
        id="comprobante"
        class="field__input"
        accept="image/*">
</div>
        <button type="submit" class="btn-cta">Guardar Gasto</button>
      </form>
    </section>

    <!-- Historial -->
   <section id="panelHistorial" class="panel--off"> 
      <table id="tablaGastos" class="card">
        <thead>
          <tr>
            <th>Fecha</th><th>Categoría</th><th>Tipo</th><th>Monto</th><th>Descripción</th><th>Acciones</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </div>
</main>
<div id="modalEditar" class="modal" hidden>
  <div class="modal__backdrop"></div>
  <div class="modal__box">
    <h2 class="modal__title">Editar gasto</h2>
    <form id="formEditar">
      <label>Monto</label>
      <input type="number" id="editMonto" required>
      <label>Fecha</label>
      <input type="date" id="editFecha" required>
      <label>Categoría</label>
      <input type="text" id="editCategoria" required>
      <label>Descripción</label>
      <input type="text" id="editDescripcion" required>
      <div style="margin-top:10px;">
        <button type="button" id="btnCancelarEditar">Cancelar</button>
        <button type="submit" id="btnConfirmarEditar">Guardar cambios</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal Eliminar -->
<div id="modalEliminar" class="modal" hidden>
  <div class="modal__backdrop"></div>
  <div class="modal__box">
    <h2 class="modal__title">Confirmar eliminación</h2>
    <p class="modal__desc">¿Seguro que querés eliminar este gasto?</p>
    <button id="btnCancelarEliminar" class="btn-cta">Cancelar</button>
    <button id="btnConfirmarEliminar" class="btn-cta" style="background:var(--error)">Eliminar</button>
  </div>
</div>

<button id="btnLogout" class="btn-cta" style="background: var(--error); margin-top: 15px;">
  Cerrar Sesión
</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="opfs.js"></script>
<script src="database.js"></script>
<script src="gastos.js"></script>
</body>
</html>
