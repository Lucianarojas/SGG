<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso - Sistema Seguro</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Outfit:wght@300;400;500;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    
<header class="theme-bar">
    <div class="theme-bar__logo">◈ SGG</div>
    <div class="theme-bar__toggle-wrap">
        <button class="theme-switch" id="themeToggle" aria-label="Cambiar tema">
            <span class="theme-switch__icon">☀</span>
            <div class="theme-switch__thumb"></div>
            <span class="theme-switch__icon">☾</span>
        </button>
    </div>
</header>
    <main class="scene">
        <div class="brand">
            <div class="brand__ornament">
                <div class="ornament-line"></div>
                <span>◈</span>
                <div class="ornament-line"></div>
            </div>
            <h1 class="brand__name">SISTEMA DE GESTIÓN DE GASTOS</h1>
        </div>

        <div class="card">
            <div id="panelLogin" class="panel">
                <div class="panel__header">
                    <h2 class="panel__title">Iniciar Sesión</h2>
                    <p class="panel__sub">Ingresa tus credenciales de acceso</p>
                </div>
                
                <div id="globalMsg" class="modal__msg error" style="display: none; margin-bottom: 15px; text-align: center;"></div>

                <form id="formLogin">
                    <div class="field">
                        <label class="field__label">Correo Electrónico</label>
                        <input type="email" id="loginEmail" class="field__input" placeholder="correo@ejemplo.com" required>
                    </div>
                    <div class="field">
                        <label class="field__label">Contraseña</label>
                        <div class="field__row">
                            <input type="password" id="loginPass" class="field__input" placeholder="••••••••" required>
                            <button type="button" class="field__eye" data-target="loginPass">
                                <svg class="icon-svg" style="margin-right:0;" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                        </div>
                    </div>
                    <button type="submit" id="btnLogin" class="btn-cta">Iniciar Sesión</button>
                </form>
                <div class="panel__footer">
                    <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
                    <p style="margin-top: 10px;"><a href="recuperar.html">¿Olvidaste tu contraseña?</a></p>
                </div>
            </div>

            <div id="welcomeBox" class="welcome-box panel--off">
                <h2 id="welcomeTitle"></h2>
                <p>Has ingresado exitosamente al sistema.</p>
                <button id="btnLogout" class="btn-cta" style="margin-top: 15px; background: var(--error);">Cerrar Sesión</button>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="opfs.js"></script>
    <script src="login.js"></script>
</body>
</html>
